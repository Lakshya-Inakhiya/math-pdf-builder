<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="{{KATEX}}/katex.min.css">
  <script defer src="{{KATEX}}/katex.min.js"></script>
  <style>
    :root {
      --ink: #14213D; --text: #223047; --muted: #5D6B82; --paper: #FFFDF8; --panel: #F3F7FF;
      --cyan: #00A7E1; --coral: #FF6B5E; --amber: #F4B942; --green: #20B486; --purple: #7C3AED; --border: #D8E2F0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--text); font: 10.5pt/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cover { min-height: 240mm; display: flex; flex-direction: column; justify-content: center; page-break-after: always; border-left: 9mm solid var(--cyan); padding-left: 14mm; }
    .cover-label { color: var(--coral); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 10pt; }
    .cover h1 { color: var(--ink); font-size: 34pt; line-height: 1.02; margin: 10mm 0 5mm; max-width: 155mm; }
    .cover p { color: var(--muted); font-size: 13pt; max-width: 140mm; }
    .toc { page-break-after: always; padding-top: 5mm; }
    .toc h2 { color: var(--ink); font-size: 21pt; border-bottom: 2px solid var(--cyan); padding-bottom: 3mm; }
    .toc ol { columns: 2; column-gap: 12mm; padding-left: 5mm; }
    .toc li { break-inside: avoid; margin: 0 0 2.5mm; }
    .toc a { color: var(--text); text-decoration: none; }
    main h2, main h3 { color: var(--ink); line-height: 1.15; page-break-after: avoid; }
    main h2 { font-size: 19pt; margin: 10mm 0 4mm; padding-left: 4mm; border-left: 5px solid var(--cyan); }
    main h3 { font-size: 13.5pt; margin: 7mm 0 2.5mm; color: #17345C; }
    p, ul, ol { margin: 0 0 3.2mm; }
    li { margin-bottom: 1.2mm; }
    strong { color: var(--ink); }
    code { background: #EAF0FA; padding: .4mm 1mm; border-radius: 3px; }
    .math.block { display: block; margin: 4mm 0; padding: 3.2mm; background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--purple); border-radius: 6px; overflow: hidden; }
    .definition, .key-result, .tips, .warning, .exam-trap, .worked-example, .formula-box {
      border-radius: 7px; padding: 3.5mm 4mm; margin: 4mm 0; page-break-inside: avoid; border: 1px solid var(--border); background: #fff;
    }
    .definition { border-left: 5px solid var(--cyan); background: #F0FBFF; }
    .key-result { border-left: 5px solid var(--green); background: #F2FFF9; }
    .formula-box { border-left: 5px solid var(--amber); background: #FFF9E8; }
    .tips { border-left: 5px solid var(--cyan); background: #F0FBFF; }
    .warning { border-left: 5px solid var(--coral); background: #FFF4F2; }
    .exam-trap { border-left: 5px solid #D7263D; background: #FFF0F4; }
    .worked-example { border-left: 5px solid var(--ink); background: var(--panel); }
    table { width: 100%; border-collapse: collapse; margin: 4mm 0; page-break-inside: avoid; }
    th, td { border: 1px solid var(--border); padding: 2mm; vertical-align: top; }
    th { background: var(--panel); color: var(--ink); }
  </style>
</head>
<body>
  <section class="cover">
    <div class="cover-label">Study guide</div>
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </section>
  <section class="toc">
    <h2>Contents</h2>
    {{TOC}}
  </section>
  <main>
    {{CONTENT}}
  </main>
  <script>
    window.__mathDone = false;
    window.addEventListener("load", () => {
      document.querySelectorAll(".math").forEach((n) => {
        try { katex.render(n.textContent, n, { displayMode: n.classList.contains("block"), throwOnError: false }); } catch (_) {}
      });
      window.__mathDone = true;
    });
  </script>
</body>
</html>
